[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcls"
version = "1.0.0"
description = "CloneStream Healthcare data-quality, reconciliation and audit pipeline (Capstone 3)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "openpyxl>=3.1",
  "pyarrow>=14",
  "duckdb>=1.0",
  "pyyaml>=6",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "sqlfluff>=3", "jsonschema>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hcls = ["dq/registry.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "realdata: runs against the full Resources/HCLS.xlsx (slower)",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/hcls"]
