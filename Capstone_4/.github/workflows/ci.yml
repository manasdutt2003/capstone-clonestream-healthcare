name: CI

# Stages 1-4 of the six-stage pipeline (SPEC section 10). Stages 5-6 (approval gate, deploy) live in deploy.yml and run after this workflow succeeds on main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  stage-1-code-quality:
    name: "1 - Code quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff lint
        run: ruff check src tests
      - name: ruff format
        run: ruff format --check src tests
      - name: sqlfluff
        run: sqlfluff lint sql --dialect duckdb
      - name: config and rule registry parse
        run: |
          python - <<'PY'
          import yaml, pathlib
          for f in ["config.yaml", "src/hcls/dq/registry.yaml"]:
              yaml.safe_load(pathlib.Path(f).read_text())
              print("ok", f)
          PY
      - name: Databricks job definitions (schema, notebooks, steps, retries, SLA)
        run: python -m hcls.deploy.validate_jobs

  stage-2-unit-tests:
    name: "2 - Unit tests"
    needs: stage-1-code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit

  stage-3-data-tests:
    name: "3 - Data validation tests"
    needs: stage-2-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/data

  stage-4-integration:
    name: "4 - Integration, regression and coverage"
    needs: stage-3-data-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: full test suite on the real workbook, coverage gate 80%
        run: pytest --cov=src/hcls --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: rebuild every output from scratch
        run: python -m hcls all
      - uses: actions/upload-artifact@v4
        with:
          name: hcls-outputs
          path: |
            outputs/gold
            data/clean/HCLS_cleaned.xlsx
            docs/01_dq_scorecard.md
            docs/CLEANING.md
            docs/stakeholder_memos
            coverage.xml
          retention-days: 30
